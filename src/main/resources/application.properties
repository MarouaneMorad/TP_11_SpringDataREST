spring.application.name=TP_11_SpringDataREST
# Configuration de la source de données H2
spring.datasource.url=jdbc:h2:mem:banque
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Activer la console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuration du serveur
server.port=8082

# Configuration Hibernate pour la création de la base de données
# permet à Hibernate de gérer automatiquement la création et la mise à jour des schémas de la base de données en fonction des entités définies.
spring.jpa.hibernate.ddl-auto=update

# Définir le chemin de base pour les APIs Spring Data REST
spring.data.rest.base-path=/api